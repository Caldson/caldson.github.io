        function sendEmail() {
            email = prompt("请输入您的邮箱：");
            if (email) {
                window.location.href = `mailto:minecraft@caldson.com?subject=%E6%9D%A5%E8%87%AAhttps%3A//caldson.github.io&from=${email}`
                console.log(`成功创建邮箱申请：发送来自${email}的申请`);
            }
        }
        function closeTips() {
            document.getElementById("tips").innerText = "";
            document.getElementById("tips_button").style.display = "none";
            document.getElementById("tips").style.display = "none";
            console.log("成功关闭上上签");
        }
        let tips_left = 5;
        function randomtip() {
            if (tips_left > 0) {
                randomtips = ["来财", "胜利", "努力", "争气", "勤奋", "聪明", "好运", "财富", "热血", "开心", "成功", "高兴", "快乐", "上进", "阳光", "自信", "坚强", "勇敢", "智慧", "善良", "健康", "幸福", "美好", "希望", "活力", "拼搏", "奋斗", "坚持", "乐观", "进取", "创新", "团结", "友善", "诚信", "担当", "责任", "感恩", "温暖", "光明", "卓越", "辉煌"]
                random_tip = randomtips[Math.floor(Math.random() * randomtips.length)]
                tips_left = tips_left - 1;
                if (tips_left == 0) {
                    document.getElementById("tips_button").innerText = "关闭上上签";
                    document.getElementById("tips").innerText = `上上签（最后一次）：${random_tip}`;
                    console.log(`成功生成上上签（最后一次）：${random_tip}`);
                } else {
                    document.getElementById("tips_button").innerText = `上上签（剩余${tips_left}次机会）`;
                    document.getElementById("tips").innerText = `上上签：${random_tip}`;
                    console.log(`成功生成上上签：${random_tip}`);
                }
            } else {
                closeTips();
            }
        }
        function reportNews() {
            email = prompt("请输入您的邮箱：");
            if (!email) {
                return;
            }
            news_id = prompt("请输入动态号：");
            if (!news_id) {
                return;
            }
            if (email && news_id) {
                const encodedText = encodeURIComponent(news_id);
                window.location.href = `mailto:minecraft@caldson.com?subject=%E4%B8%BE%E6%8A%A5caldson.github.io%E5%8A%A8%E6%80%81%E5%8F%B7%EF%BC%9A${encodedText}&from=${email}`
            }
        }
        function copyWechatId() {
            const wechatId = "MinecraftCaldson";
            const input = document.createElement("input");
            input.value = wechatId;
            document.body.appendChild(input);
            input.select();
            document.execCommand("copy");
            document.body.removeChild(input);
            alert("微信号已复制到剪贴板：" + wechatId);
        }
        function copyNewsId(news_id) {
            navigator.clipboard.writeText(news_id);
            alert("动态号已复制到剪贴板：" + news_id);
        }
        function getYear() {
